<style>
@font-face{font-family:"Inter Tight Variable";font-weight:100 900;font-display:swap;src:url(/assets/inter-tight-latin-wght-normal-DX-nOvPD.woff2) format("woff2-variations")}
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:400;font-display:swap;src:url(/assets/ibm-plex-sans-arabic-arabic-400-normal-DqElNKgb.woff2) format("woff2");unicode-range:U+6??,U+200C-200F}
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:600;font-display:swap;src:url(/assets/ibm-plex-sans-arabic-arabic-600-normal-DIa3GCJg.woff2) format("woff2");unicode-range:U+6??,U+200C-200F}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Inter Tight Variable","IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.55;font-size:16px}
[dir=rtl] body{font-family:"IBM Plex Sans Arabic","Inter Tight Variable",system-ui,sans-serif}
.container{width:100%;max-width:1120px;margin:0 auto;padding:0 16px}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:700}
.brand__mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:14px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.bar__end{display:flex;gap:8px}
.icon-btn,.lang{background:var(--surface);border:1px solid var(--line-2);color:var(--text);border-radius:8px;height:38px;min-width:38px;padding:0 12px;font:inherit;font-size:14px;cursor:pointer}
.hero{padding:40px 0 20px}
.kicker{color:var(--accent-text);font-weight:600}
h1{font-size:clamp(34px,6vw,56px);line-height:1.04;margin-top:8px}
.hero p{color:var(--text-2);margin-top:12px;font-size:17px;max-width:42rem}
.layout{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:20px;align-items:start;padding-bottom:28px}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.card h2{font-size:19px;font-weight:700;margin-bottom:12px}
.tasks{list-style:none;display:grid;gap:8px}
.task{border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.task.is-on{border-color:var(--accent)}
.task__toggle{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;background:none;border:0;color:var(--text);font:inherit;font-size:16px;text-align:start;cursor:pointer}
.box{flex:none;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:14px;color:var(--accent-ink)}
.task.is-on .box{background:var(--accent);border-color:var(--accent)}
.task__name{font-weight:600}
.task__fields{display:flex;flex-wrap:wrap;gap:10px 18px;padding:0 14px 14px 48px;color:var(--text-2);font-size:14.5px;align-items:center}
[dir=rtl] .task__fields{padding:0 48px 14px 14px}
.task__fields label{display:inline-flex;align-items:center;gap:8px}
.task__fields input,.task__fields select{height:36px;background:var(--surface);border:1px solid var(--line-2);border-radius:7px;color:var(--text);font:inherit;font-size:15px;padding:0 8px}
.task__fields input{width:72px;font-variant-numeric:tabular-nums}
.result{position:sticky;top:16px}
@media (max-width:900px){.result{position:static}}
.big{font-family:"Instrument Serif","Amiri",Georgia,serif;font-size:clamp(64px,10vw,96px);line-height:1;font-variant-numeric:tabular-nums}
[dir=rtl] .big{font-family:"Amiri",serif;font-weight:700}
.big-sub{color:var(--text-2);margin-top:4px;font-size:17px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.fact{border-top:1px solid var(--line-2);padding-top:10px}
.fact b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.fact span{color:var(--muted);font-size:13.5px}
.bars{list-style:none;display:grid;gap:10px;margin-top:6px}
.bars li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.bars .track{grid-column:1/3;height:8px;border-radius:99px;background:var(--line-2);overflow:hidden}
.bars .fill{display:block;height:100%;background:var(--accent);border-radius:99px}
.bars .h{color:var(--muted);font-variant-numeric:tabular-nums}
.start{margin-top:18px;padding:14px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--line-2)}
.start p{font-size:14px;color:var(--text-2)}
.start a{display:inline-block;margin-top:4px;font-weight:650}
.btn{height:40px;padding:0 16px;border-radius:8px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn--primary{background:var(--accent);color:var(--accent-ink)}
.btn--quiet{background:transparent;color:var(--text-2);border-color:var(--line-2)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.empty{color:var(--muted);padding:24px 0}
.note{color:var(--muted);font-size:13px;margin-top:14px}
footer{border-top:1px solid var(--line);padding:20px 0 40px;color:var(--muted);font-size:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
<link rel="stylesheet" href="/ahl-theme.css">
</head>
<body>
<header class="container"><div class="bar">
  <a class="brand" href="/"><span class="brand__mark" aria-hidden="true">AH</span><span><span data-t="brand"></span><small data-t="brandTag"></small></span></a>
  <div class="bar__end"><button class="lang" id="lang" type="button"></button><button class="icon-btn" id="theme" type="button"></button></div>
</div></header>

<main class="container">
  <section class="hero">
    <p class="kicker" data-t="kicker"></p>
    <h1 data-t="title"></h1>
    <p data-t="lead"></p>
  </section>
  <div class="layout">
    <section class="card" aria-labelledby="tasks-title">
      <h2 id="tasks-title" data-t="tasksTitle"></h2>
      <ul class="tasks" id="tasks" role="list"></ul>
    </section>
    <section class="card result" aria-live="polite" aria-labelledby="res-title">
      <h2 id="res-title" data-t="resTitle"></h2>
      <div id="result"></div>
    </section>
  </div>
</main>
<footer class="container"><p data-t="foot"></p></footer>
<div class="toast" id="toast" role="status"></div>

<script>
const T = {
  en:{brand:"Ahmed Hussein",brandTag:"AI Lessons",kicker:"Free calculator",title:"How much time could AI save you?",
    lead:"Tick the tasks you do, adjust how often and how long they take, and see a realistic estimate. The numbers already include time to check the AI’s work.",
    tasksTitle:"Your tasks",resTitle:"Your estimate",often:"How often",minutes:"Minutes each time",
    units:{day:"per day",week:"per week",month:"per month"},
    hours:"hours a month",perWeek:"hours a week",perYear:"hours a year",days:"working days a year",
    breakdown:"Where the time comes from",startWith:"Start with your biggest win:",
    empty:"Tick at least one task to see your estimate.",share:"Share my result",linkCopied:"Link copied",
    shareText:h=>`AI could save me about ${h} hours a month at work. Work out yours:`,
    note:"Estimates assume AI does a first draft or first pass and you check it. Savings used: 25-50% depending on the task. Your real results depend on the tool, your data and your company’s AI policy.",
    other:"العربي",theme:["Light mode","Dark mode"],h:"h",
    foot:"Independent site. Not affiliated with any AI company mentioned here. Nothing you enter leaves this page."},
  ar:{brand:"أحمد حسين",brandTag:"دروس الذكاء الاصطناعي",kicker:"حاسبة ببلاش",title:"الذكاء الاصطناعي ممكن يوفّرلك وقت قد إيه؟",
    lead:"اختار المهام اللي بتعملها، وعدّل عدد المرات ووقت كل مرة، وخد تقدير واقعي. الأرقام محسوب فيها وقت مراجعة شغل الذكاء الاصطناعي.",
    tasksTitle:"مهامك",resTitle:"التقدير بتاعك",often:"كام مرة",minutes:"دقايق كل مرة",
    units:{day:"كل يوم",week:"كل أسبوع",month:"كل شهر"},
    hours:"ساعة في الشهر",perWeek:"ساعة في الأسبوع",perYear:"ساعة في السنة",days:"يوم شغل في السنة",
    breakdown:"الوقت ده جاي منين",startWith:"ابدأ بأكبر مكسب ليك:",
    empty:"اختار مهمة واحدة على الأقل عشان تشوف التقدير بتاعك.",share:"شارك نتيجتي",linkCopied:"اللينك اتنسخ",
    shareText:h=>`الذكاء الاصطناعي ممكن يوفّرلي حوالي ${h} ساعة في الشهر في الشغل. احسب وقتك إنت:`,
    note:"التقدير ده بيفترض إن الذكاء الاصطناعي بيكتب أول نسخة أو أول محاولة وإنت بتراجعها. نسب التوفير اللي استخدمناها: 25-50% على حسب المهمة. النتيجة الحقيقية بتعتمد على الأداة وبياناتك وسياسة شركتك.",
    other:"English",theme:["الوضع الفاتح","الوضع الغامق"],h:"س",
    foot:"موقع مستقل ومش تبع أي شركة ذكاء اصطناعي مذكورة فيه. اللي بتكتبه في الصفحة دي مش بيخرج منها."}
};

/* rate = share of the time saved after checking the AI's work (conservative). */
const TASKS = [
  {id:'email',en:'Writing and replying to emails',ar:'كتابة الإيميلات والرد عليها',n:10,unit:'week',min:12,rate:.3,lesson:'/lessons/emails-in-english-and-arabic/',len:'Write work emails in English and Arabic',lar:'اكتب إيميلات الشغل بالعربي والإنجليزي'},
  {id:'meetings',en:'Meeting notes and follow-ups',ar:'ملاحظات الاجتماعات والمتابعة',n:3,unit:'week',min:25,rate:.4,lesson:'/lessons/teams-better-meetings/',len:'Better Teams meetings',lar:'اجتماعات Teams أوضح'},
  {id:'docs',en:'Reading and summarising long documents',ar:'قراية الملفات الطويلة وتلخيصها',n:2,unit:'week',min:40,rate:.4,lesson:'/lessons/summarize-documents-and-meetings/',len:'Summarize long documents and meetings',lar:'لخّص الملفات الطويلة والاجتماعات'},
  {id:'excel',en:'Excel formulas and cleaning data',ar:'معادلات Excel وتنضيف البيانات',n:3,unit:'week',min:30,rate:.35,lesson:'/lessons/excel-formulas-and-cleanup/',len:'Excel with AI: formulas and messy data',lar:'Excel مع الذكاء الاصطناعي'},
  {id:'reports',en:'Writing reports and proposals',ar:'كتابة التقارير والعروض',n:1,unit:'week',min:90,rate:.3,lesson:'/lessons/proposals-and-reports/',len:'Write proposals and reports with AI',lar:'اكتب العروض والتقارير بالذكاء الاصطناعي'},
  {id:'research',en:'Research and fact-finding',ar:'البحث وتجميع المعلومات',n:2,unit:'week',min:30,rate:.3,lesson:'/lessons/check-facts-and-numbers/',len:'When AI is wrong: check facts and numbers',lar:'لما الذكاء الاصطناعي يغلط'},
  {id:'translate',en:'Translating between English and Arabic',ar:'الترجمة بين العربي والإنجليزي',n:3,unit:'week',min:20,rate:.5,lesson:'/lessons/emails-in-english-and-arabic/',len:'Write work emails in English and Arabic',lar:'اكتب إيميلات الشغل بالعربي والإنجليزي'},
  {id:'close',en:'Month-end close notes and variance commentary',ar:'ملاحظات قفل الشهر وشرح الفروقات',n:1,unit:'month',min:180,rate:.25,lesson:'/lessons/month-end-close-with-ai/',len:'Month-end close with AI',lar:'قفل آخر الشهر مع الذكاء الاصطناعي'},
  {id:'slides',en:'Presentations and slides',ar:'العروض التقديمية والسلايدز',n:1,unit:'week',min:60,rate:.3,lesson:'/tools/',len:'AI Tool Library',lar:'مكتبة أدوات الذكاء الاصطناعي'}
];
const PER_MONTH = { day: 21.7, week: 4.33, month: 1 };   // working days in an average month
const DEFAULT_ON = ['email', 'meetings', 'docs'];

const params = new URLSearchParams(location.search);
const state = { lang: params.get('lang') === 'ar' || location.pathname.startsWith('/ar/') ? 'ar' : 'en', theme: document.documentElement.dataset.theme || 'dark', tasks: {} };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (n, d = 0) => n.toLocaleString(state.lang === 'ar' ? 'ar-SA-u-nu-latn' : 'en-GB', { maximumFractionDigits: d, minimumFractionDigits: d });

try { state.tasks = JSON.parse(localStorage.getItem('ahl:timesaved')) || {}; } catch (_) {}
for (const t of TASKS) state.tasks[t.id] = Object.assign({ on: DEFAULT_ON.includes(t.id), n: t.n, unit: t.unit, min: t.min }, state.tasks[t.id] || {});
const save = () => { try { localStorage.setItem('ahl:timesaved', JSON.stringify(state.tasks)); } catch (_) {} };

function renderTasks() {
  const t = T[state.lang];
  $('#tasks').innerHTML = TASKS.map(k => { const s = state.tasks[k.id]; return `
    <li class="task${s.on ? ' is-on' : ''}" data-id="${k.id}">
      <button type="button" class="task__toggle" aria-pressed="${s.on}"><span class="box" aria-hidden="true">${s.on ? '✓' : ''}</span><span class="task__name">${esc(k[state.lang])}</span></button>
      ${s.on ? `<div class="task__fields">
        <label>${t.often} <input type="number" inputmode="numeric" min="0" max="99" step="1" value="${s.n}" data-f="n" aria-label="${t.often}">
          <select data-f="unit" aria-label="${t.often}">${['day','week','month'].map(u => `<option value="${u}"${s.unit === u ? ' selected' : ''}>${t.units[u]}</option>`).join('')}</select></label>
        <label>${t.minutes} <input type="number" inputmode="numeric" min="0" max="600" step="5" value="${s.min}" data-f="min"></label>
      </div>` : ''}
    </li>`; }).join('');
}

function calc() {
  return TASKS.filter(k => state.tasks[k.id].on).map(k => {
    const s = state.tasks[k.id];
    const n = Math.max(0, Math.min(99, +s.n || 0)), min = Math.max(0, Math.min(600, +s.min || 0));
    return { k, hours: n * PER_MONTH[s.unit] * min * k.rate / 60 };
  }).filter(r => r.hours > 0).sort((a, b) => b.hours - a.hours);
}

function renderResult() {
  const t = T[state.lang], rows = calc();
  if (!rows.length) { $('#result').innerHTML = `<p class="empty">${t.empty}</p>`; return; }
  const month = rows.reduce((a, r) => a + r.hours, 0), max = rows[0].hours, top = rows[0].k;
  const href = (top.lesson.startsWith('/lessons/') || top.lesson === '/tools/') && state.lang === 'ar' ? '/ar' + top.lesson : top.lesson;
  $('#result').innerHTML = `
    <p class="big">${fmt(month, month < 10 ? 1 : 0)}</p><p class="big-sub">${t.hours}</p>
    <div class="facts">
      <div class="fact"><b>${fmt(month / 4.33, 1)}</b><span>${t.perWeek}</span></div>
      <div class="fact"><b>${fmt(month * 12)}</b><span>${t.perYear}</span></div>
      <div class="fact"><b>${fmt(month * 12 / 8, 1)}</b><span>${t.days}</span></div>
    </div>
    <p style="font-weight:600;font-size:14px;margin-bottom:8px">${t.breakdown}</p>
    <ul class="bars" role="list">${rows.map(r => `<li><span>${esc(r.k[state.lang])}</span><span class="h">${fmt(r.hours, 1)} ${t.h}</span>
      <span class="track" aria-hidden="true"><span class="fill" style="width:${(r.hours / max * 100).toFixed(1)}%"></span></span></li>`).join('')}</ul>
    <div class="start"><p>${t.startWith}</p><a href="${href}">${esc(state.lang === 'ar' ? top.lar : top.len)}</a></div>
    <div class="row"><button class="btn btn--quiet" type="button" id="share" data-h="${fmt(month)}">${t.share}</button></div>
    <p class="note">${t.note}</p>`;
}

function renderStatic() {
  const t = T[state.lang];
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t[el.dataset.t]; });
  $('#lang').textContent = t.other; $('#lang').lang = state.lang === 'ar' ? 'en' : 'ar';
  const dark = state.theme === 'dark';
  $('#theme').textContent = dark ? '☀' : '☾'; $('#theme').setAttribute('aria-label', t.theme[dark ? 0 : 1]);
  document.title = state.lang === 'ar' ? 'الذكاء الاصطناعي يوفّرلك وقت قد إيه؟ | أحمد حسين · دروس الذكاء الاصطناعي' : 'How much time could AI save you? | Ahmed Hussein · AI Lessons';
}
function render() { renderStatic(); renderTasks(); renderResult(); }

let toastTimer;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200); }

$('#tasks').addEventListener('click', e => {
  const b = e.target.closest('.task__toggle'); if (!b) return;
  const id = b.closest('.task').dataset.id; state.tasks[id].on = !state.tasks[id].on;
  save(); renderTasks(); renderResult();
  document.querySelector(`.task[data-id="${id}"] .task__toggle`).focus();
});
$('#tasks').addEventListener('input', e => {
  const f = e.target.dataset.f; if (!f) return;
  const id = e.target.closest('.task').dataset.id; state.tasks[id][f] = e.target.value;
  save(); renderResult();
});
$('#result').addEventListener('click', async e => {
  if (e.target.id !== 'share') return;
  const t = T[state.lang], url = location.origin + (state.lang === 'ar' ? '/ar/time-saved' : '/time-saved'), text = t.shareText(e.target.dataset.h);
  if (navigator.share) { try { await navigator.share({ title: document.title, text, url }); } catch (_) {} }
  else { try { await navigator.clipboard.writeText(text + ' ' + url); toast(t.linkCopied); } catch (_) {} }
});
$('#lang').addEventListener('click', () => {
  state.lang = state.lang === 'en' ? 'ar' : 'en';
  history.replaceState(null, '', state.lang === 'ar' ? '/ar/time-saved' : '/time-saved'); render();
});
$('#theme').addEventListener('click', () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = state.theme;
  try { localStorage.setItem('ahl:theme', state.theme); } catch (_) {}
  renderStatic();
});
render();
</script>
<script defer src="/ahl-links.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
