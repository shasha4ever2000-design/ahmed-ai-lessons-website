    p_ar:"اجعل هذا الإيميل واثقًا ومهذبًا، وأقل من [100] كلمة، دون تغيير الحقائق: [الصق الإيميل]."},
  canva:{name:"Canva",maker:"Canva",url:"https://www.canva.com/",price:"fp",level:"b",lesson:null,
    en:"Design with AI help for slides, social posts and images, no design skills needed.",
    ar:"تصميم بمساعدة الذكاء الاصطناعي للعروض ومنشورات التواصل والصور، دون خبرة في التصميم.",
    p_en:"Create a 5-slide presentation about [topic] for [audience]. Clean, professional style, one key message per slide.",
    p_ar:"أنشئ عرضًا من 5 شرائح عن [الموضوع] لـ[الجمهور]. أسلوب نظيف ومهني، ورسالة رئيسية واحدة في كل شريحة."},
  midjourney:{name:"Midjourney",maker:"Midjourney",url:"https://www.midjourney.com/",price:"paid",level:"i",lesson:null,
    en:"Creates high-quality images from a description. Best for illustrations and concept images.",
    ar:"ينشئ صورًا عالية الجودة من وصف نصي. الأفضل للرسوم التوضيحية وصور الأفكار.",
    p_en:"A clean, modern illustration of [subject], soft lighting, [brand colours], plenty of empty space for text, wide format.",
    p_ar:"رسم توضيحي حديث ونظيف لـ[الموضوع]، إضاءة ناعمة، [ألوان العلامة]، مساحة فارغة للنص، بصيغة عريضة."},
  notion:{name:"Notion AI",maker:"Notion",url:"https://www.notion.com/product/ai",price:"fp",level:"b",lesson:null,
    en:"AI inside your Notion pages: summarise, draft and search your team’s notes.",
    ar:"ذكاء اصطناعي داخل صفحات Notion: يلخّص ويكتب ويبحث في ملاحظات فريقك.",
    p_en:"Summarise this page into decisions, open questions and next steps with owners. Keep it under [150] words.",
    p_ar:"لخّص هذه الصفحة إلى قرارات وأسئلة مفتوحة وخطوات تالية مع المسؤولين. أقل من [150] كلمة."},
  otter:{name:"Otter.ai",maker:"Otter.ai",url:"https://otter.ai/",price:"fp",level:"b",lesson:"/lessons/teams-better-meetings/",
    en:"Records and transcribes meetings, then writes a summary with action items.",
    ar:"يسجّل الاجتماعات وينسخها نصيًا، ثم يكتب ملخصًا مع المهام.",
    p_en:"From this meeting transcript, list decisions, action items with owner and due date, and anything still unclear.",
    p_ar:"من نص هذا الاجتماع، اذكر القرارات، والمهام مع المسؤول والموعد، وأي شيء ما زال غير واضح."},
  fireflies:{name:"Fireflies.ai",maker:"Fireflies.ai",url:"https://fireflies.ai/",price:"fp",level:"b",lesson:"/lessons/teams-better-meetings/",
    en:"Joins your online meetings to take notes and find key moments. Good for teams with many calls.",
    ar:"ينضم إلى اجتماعاتك عبر الإنترنت ليدوّن الملاحظات ويجد اللحظات المهمة. مناسب للفرق كثيرة الاجتماعات.",
    p_en:"From this meeting transcript, list decisions, action items with owner and due date, and anything still unclear.",
    p_ar:"من نص هذا الاجتماع، اذكر القرارات، والمهام مع المسؤول والموعد، وأي شيء ما زال غير واضح."},
  cursor:{name:"Cursor",maker:"Anysphere",url:"https://cursor.com/",price:"fp",level:"i",lesson:null,
    en:"A code editor with AI that writes and fixes code with you. Good for small tools and scripts.",
    ar:"محرر برمجة بالذكاء الاصطناعي يكتب الكود ويصلحه معك. مناسب للأدوات الصغيرة والسكربتات.",
    p_en:"Build a small script that reads [file.csv], totals [column] by [category], and saves the result as a new CSV. Explain each step simply.",
    p_ar:"ابنِ سكربتًا صغيرًا يقرأ [file.csv]، ويجمع [العمود] حسب [التصنيف]، ويحفظ النتيجة في ملف CSV جديد. اشرح كل خطوة ببساطة."},
  zapier:{name:"Zapier",maker:"Zapier",url:"https://zapier.com/",price:"fp",level:"i",lesson:"/lessons/first-ai-automation/",
    en:"Connects your apps so repeated tasks run on their own, with AI steps in between.",
    ar:"يربط تطبيقاتك لتعمل المهام المتكررة تلقائيًا، مع خطوات ذكاء اصطناعي بينها.",
    p_en:"When a new form reply arrives, summarise it in 2 sentences, label it [urgent / normal], and add a row to my sheet with the summary.",
    p_ar:"عند وصول رد جديد على النموذج، لخّصه في جملتين، وصنّفه [عاجل / عادي]، وأضف صفًا في جدولي مع الملخص."}
};

const params = new URLSearchParams(location.search);
const state = {
  lang: params.get('lang') === 'ar' || location.pathname.startsWith('/ar/') ? 'ar' : 'en',
  theme: document.documentElement.dataset.theme || 'dark',
  step: 0, answers: []
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials = n => n.replace(/[^A-Za-z ]/g,'').split(' ').filter(Boolean).slice(0,2).map(w => w[0]).join('').slice(0,2) || n.slice(0,2);
const lessonHref = p => (state.lang === 'ar' ? '/ar' : '') + p;

function results() {
  const score = Object.fromEntries(Object.keys(TOOLS).map(k => [k, 0]));
  // The main task counts double so a specialist (Canva, Cursor, Fireflies) beats the all-rounders when it fits.
  state.answers.forEach((a, qi) => { const q = QUESTIONS[qi], w = q.opts[a].w, m = q.id === 'task' ? 2 : 1; for (const k in w) score[k] += w[k] * m; });
  // Ties keep the Tool Library order, which lists the easiest tools first.
  return Object.keys(TOOLS).sort((a, b) => score[b] - score[a]).slice(0, 3);
}

function renderQuestion() {
  const t = T[state.lang], q = QUESTIONS[state.step], n = QUESTIONS.length;
  const sel = state.answers[state.step];
  $('#hero').hidden = false;
  $('#app').innerHTML = `
    <section class="card">
      <div class="progress"><div class="progress__track"><div class="progress__fill" style="width:${(state.step / n) * 100}%"></div></div><span>${t.of(state.step + 1, n)}</span></div>
      <h2 class="q" id="q">${esc(q[state.lang])}</h2>
      <ul class="opts" role="list" aria-labelledby="q">${q.opts.map((o, i) => `
        <li><button type="button" class="opt" data-i="${i}" aria-pressed="${sel === i}">
          <span class="opt__ic" aria-hidden="true">${o.ic}</span>
          <span>${esc(o[state.lang])}${o.sub ? `<small>${esc(o.sub[state.lang])}</small>` : ''}</span>
        </button></li>`).join('')}
      </ul>
      <div class="nav"><button type="button" class="btn btn--quiet" id="back" ${state.step === 0 ? 'disabled' : ''}>${state.lang === 'ar' ? '→' : '←'} ${t.back}</button></div>
    </section>`;
}

function promptHtml(s) { return esc(s).replace(/\[([^\]]+)\]/g, '<mark>[$1]</mark>'); }

function renderResult() {
  const t = T[state.lang], [best, ...rest] = results(), b = TOOLS[best];
  const chosen = state.answers.map((a, qi) => QUESTIONS[qi].opts[a][state.lang]);
  $('#hero').hidden = true;
  const tags = x => `<div class="tags"><span class="tag">${t.price[x.price]}</span><span class="tag">${t.level[x.level]}</span></div>`;
  $('#app').innerHTML = `
    <section class="card best" style="margin-top:28px">
      <p class="label">${t.best}</p>
      <div class="tool"><span class="logo" aria-hidden="true">${esc(initials(b.name))}</span>
        <div><h2 id="result-title" tabindex="-1">${esc(b.name)}</h2><span class="maker">${esc(b.maker)}</span></div></div>
      ${tags(b)}
      <p class="why">${esc(b[state.lang])}</p>
      <p class="because">${t.because} ${chosen.map(esc).join(' · ')}</p>
      <div class="starter"><p class="label">${t.starter}</p><div class="prompt" dir="auto">${promptHtml(b['p_' + state.lang])}</div></div>
      <div class="row">
        <button type="button" class="btn btn--primary" data-copy="${best}">${t.copy}</button>
        <a class="btn btn--quiet" href="${b.url}" target="_blank" rel="noopener">${t.open} ${esc(b.name)} ↗</a>
        ${b.lesson ? `<a class="btn btn--quiet" href="${lessonHref(b.lesson)}">${t.lesson}</a>` : ''}
      </div>
    </section>
    <p class="label" style="margin-bottom:12px">${t.also}</p>
    <div class="also">${rest.map(k => { const x = TOOLS[k]; return `
      <section class="card">
        <div class="tool" style="margin:0"><span class="logo" aria-hidden="true">${esc(initials(x.name))}</span><div><h3>${esc(x.name)}</h3><span class="maker">${esc(x.maker)}</span></div></div>
        ${tags(x)}
        <p class="why">${esc(x[state.lang])}</p>
        <div class="row"><a class="btn btn--quiet" href="${x.url}" target="_blank" rel="noopener">${t.open} ↗</a>
          ${x.lesson ? `<a class="btn btn--quiet" href="${lessonHref(x.lesson)}">${t.lesson}</a>` : ''}</div>
      </section>`; }).join('')}
    </div>
    <p class="note">${t.note}</p>
    <div class="row" style="margin:0 0 28px">
      <button type="button" class="btn btn--quiet" id="share" data-name="${esc(b.name)}">${t.share}</button>
      <button type="button" class="btn btn--quiet" id="restart">↺ ${t.restart}</button>
    </div>
    <div class="cta">
      <div><h2>${t.ctaTitle}</h2><p>${t.ctaText}</p></div>
      <div class="row" style="margin:0"><a class="btn btn--primary" href="${state.lang === 'ar' ? '/ar/' : '/'}#newsletter">${t.ctaBtn}</a>
        <a class="btn btn--quiet" href="${state.lang === 'ar' ? '/ar/tools/' : '/tools/'}">${t.ctaTools}</a></div>
    </div>`;
  window.scrollTo(0, 0);
  $('#result-title').focus({ preventScroll: true });
}

function render() { state.step < QUESTIONS.length ? renderQuestion() : renderResult(); }

function renderStatic() {
  const t = T[state.lang];
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t[el.dataset.t]; });
  $('#lang').textContent = t.other;
  $('#lang').lang = state.lang === 'ar' ? 'en' : 'ar';
  const dark = state.theme === 'dark';
  $('#theme').textContent = dark ? '☀' : '☾';
  $('#theme').setAttribute('aria-label', t.theme[dark ? 0 : 1]);
  document.title = state.lang === 'ar' ? 'أي أداة ذكاء اصطناعي تناسبني؟ | أحمد حسين · دروس الذكاء الاصطناعي' : 'Which AI tool should I use? | Ahmed Hussein · AI Lessons';
}

async function copyText(s) {
  try { await navigator.clipboard.writeText(s); return true; }
  catch (_) {
    const ta = document.createElement('textarea'); ta.value = s; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  }
}
let toastTimer;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

$('#app').addEventListener('click', async e => {
  const t = T[state.lang];
  const opt = e.target.closest('.opt');
  if (opt) {
    state.answers[state.step] = +opt.dataset.i;
    opt.setAttribute('aria-pressed', 'true');
    // Short pause so the tap feels registered before the next question.
    setTimeout(() => { state.step++; render(); $('#app .opt, #result-title')?.focus({ preventScroll: true }); }, 180);
    return;
  }
  if (e.target.closest('#back') && state.step > 0) { state.step--; render(); return; }
  if (e.target.closest('#restart')) { state.step = 0; state.answers = []; render(); window.scrollTo(0, 0); return; }
  const c = e.target.closest('[data-copy]');
  if (c && await copyText(TOOLS[c.dataset.copy]['p_' + state.lang])) {
    c.textContent = t.copied; c.classList.add('is-done'); toast(t.copiedToast);
    setTimeout(() => { c.textContent = t.copy; c.classList.remove('is-done'); }, 1600);
    return;
  }
  const s = e.target.closest('#share');
  if (s) {
    const url = location.origin + (state.lang === 'ar' ? '/ar/ai-tool-quiz' : '/ai-tool-quiz');
    const text = t.shareText(s.dataset.name);
    if (navigator.share) { try { await navigator.share({ title: document.title, text, url }); } catch (_) {} }
    else if (await copyText(text + ' ' + url)) toast(t.linkCopied);
  }
});
$('#lang').addEventListener('click', () => {
  state.lang = state.lang === 'en' ? 'ar' : 'en';
  history.replaceState(null, '', state.lang === 'ar' ? '/ar/ai-tool-quiz' : '/ai-tool-quiz');
  renderStatic(); render();
});
$('#theme').addEventListener('click', () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = state.theme;
  try { localStorage.setItem('ahl:theme', state.theme); } catch (_) {}
  renderStatic();
});

renderStatic(); render();
</script>
<script defer src="/ahl-links.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
