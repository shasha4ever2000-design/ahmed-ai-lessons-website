*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Inter Tight Variable","IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.55;font-size:16px}
[dir=rtl] body{font-family:"IBM Plex Sans Arabic","Inter Tight Variable",system-ui,sans-serif}
.container{width:100%;max-width:880px;margin:0 auto;padding:0 16px}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);max-width:1120px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:700}
.brand__mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:14px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.bar__end{display:flex;gap:8px}
.icon-btn,.lang{background:var(--surface);border:1px solid var(--line-2);color:var(--text);border-radius:8px;height:38px;min-width:38px;padding:0 12px;font:inherit;font-size:14px;cursor:pointer}
.hero{padding:40px 0 20px}
.kicker{color:var(--accent-text);font-weight:600}
h1{font-size:clamp(34px,6vw,56px);line-height:1.04;margin-top:8px}
.hero p{color:var(--text-2);margin-top:12px;font-size:17px;max-width:40rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:22px}
.card h2{font-size:20px;font-weight:700}
.count{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.meter{height:8px;border-radius:99px;background:var(--line-2);margin:12px 0 6px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.steps{list-style:none;display:grid;gap:8px;margin-top:14px}
.step{display:grid;grid-template-columns:32px 1fr auto;gap:2px 12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.step__n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;border:1.5px solid var(--line-2);color:var(--muted)}
.step.is-done .step__n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step__t{font-weight:650}
.step__s{grid-column:2;color:var(--muted);font-size:14px}
.step__go{grid-row:1/3;grid-column:3}
.btn{height:40px;padding:0 16px;border-radius:8px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn--sm{height:34px;padding:0 12px;font-size:13.5px}
.btn--primary{background:var(--accent);color:var(--accent-ink)}
.btn--primary:hover{background:var(--accent-hover)}
.btn--quiet{background:transparent;color:var(--text-2);border-color:var(--line-2)}
.btn--quiet:hover{border-color:var(--accent);color:var(--text)}
.btn.is-done{background:var(--ok,#4ade80);color:#07080c}
.btn[disabled]{opacity:.45;cursor:default}
.done-tag{color:var(--accent-text);font-size:14px;font-weight:600}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=text]{width:100%;height:46px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;color:var(--text);font:inherit;font-size:17px;padding:0 14px}
input[type=text]:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.hint{color:var(--muted);font-size:13.5px;margin-top:6px}
.preview{margin-top:16px;border-radius:8px;overflow:hidden;border:1px solid var(--line-2);background:var(--surface-2);position:relative}
.preview canvas{display:block;width:100%;height:auto}
.locked[hidden]{display:none}
.locked{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(3px);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.note{color:var(--muted);font-size:13.5px;margin-top:12px}
footer{border-top:1px solid var(--line);padding:20px 0 40px;color:var(--muted);font-size:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:560px){.step{grid-template-columns:32px 1fr}.step__go{grid-row:auto;grid-column:2;justify-self:start;margin-top:6px}}
@media (prefers-reduced-motion:reduce){.meter span,.toast{transition:none}}

<script>
const T = {
  en:{brand:"Ahmed Hussein",brandTag:"AI Lessons",kicker:"Free certificate",title:"Finish Start Here, get your certificate",
    lead:"Six short lessons take you from your first prompt to your first automation. Finish all six and download a certificate you can add to LinkedIn.",
    progTitle:"Your progress",count:(d,n)=>`${d} of ${n} done`,device:"Progress is saved in this browser on this device. Use “Mark this lesson as done” at the end of each lesson.",
    open:"Open lesson",markDone:"I’ve done it",done:"Done",
    certTitle:"Your certificate",nameLabel:"Your name, as it should appear",nameHint:"Only used to draw the certificate. It isn’t sent anywhere.",
    namePh:"e.g. Sara Al-Qahtani",lockedMsg:n=>`Finish the ${n} remaining ${n===1?'step':'steps'} to unlock your certificate.`,needName:"Type your name to finish your certificate.",
    download:"Download certificate (PNG)",linkedin:"Add to LinkedIn",share:"Share",linkCopied:"Link copied",
    shareText:"I finished Start Here: AI for work, six practical lessons by Ahmed Hussein. Free, in English and Arabic:",
    honest:"This certificate shows you finished the lessons on this site. It isn’t an accredited qualification.",
    other:"العربي",theme:["Light mode","Dark mode"],
    foot:"Independent site. Not affiliated with any AI company mentioned here.",
    steps:[["Understand AI","The free 4-part prompt lesson","/#free-lesson"],["Learn prompting","5 prompt patterns that work in any AI tool","/lessons/prompt-patterns/"],["Master ChatGPT","Set up ChatGPT for work","/lessons/set-up-chatgpt-for-work/"],["Explore Claude","Claude Projects: stop repeating yourself","/lessons/claude-projects/"],["Build AI workflows","Summarize long documents and meetings","/lessons/summarize-documents-and-meetings/"],["Automate your work","Your first AI automation, no code","/lessons/first-ai-automation/"]],
    c:{title:"Certificate of completion",certifies:"This certifies that",completed:"completed Start Here: AI for work",
      body:"Six practical lessons: the 4-part prompt, prompt patterns, ChatGPT for work, Claude Projects, summarising documents and meetings, and a first no-code automation.",
      issued:"Issued",by:"Ahmed Hussein",byRole:"AI Lessons",id:"Certificate ID",placeholder:"Your name"}},
  ar:{brand:"أحمد حسين",brandTag:"دروس الذكاء الاصطناعي",kicker:"شهادة ببلاش",title:"خلّص «ابدأ هنا» وخد شهادتك",
    lead:"6 دروس قصيرة بتاخدك من أول برومبت لأول أتمتة. خلّص الستة ونزّل شهادة تحطها على LinkedIn.",
    progTitle:"وصلت لفين",count:(d,n)=>`خلّصت ${d} من ${n}`,device:"تقدّمك بيتحفظ في المتصفح ده على الجهاز ده. استخدم «خلّصت الدرس» في آخر كل درس.",
    open:"افتح الدرس",markDone:"خلّصته",done:"خلصان",
    certTitle:"شهادتك",nameLabel:"اسمك زي ما عايزه يظهر",nameHint:"بيتستخدم في رسم الشهادة بس، ومش بيتبعت لأي حتة.",
    namePh:"مثلًا: سارة القحطاني",lockedMsg:n=>`خلّص ${n === 1 ? 'الخطوة اللي فاضلة' : `الخطوات اللي فاضلة (${n})`} عشان تفتح شهادتك.`,needName:"اكتب اسمك عشان شهادتك تكمل.",
    download:"نزّل الشهادة (PNG)",linkedin:"حطها على LinkedIn",share:"شارك",linkCopied:"اللينك اتنسخ",
    shareText:"خلّصت «ابدأ هنا: الذكاء الاصطناعي في الشغل»، 6 دروس عملية من أحمد حسين. ببلاش بالعربي والإنجليزي:",
    honest:"الشهادة دي بتثبت إنك خلّصت الدروس على الموقع ده، ومش شهادة معتمدة.",
    other:"English",theme:["الوضع الفاتح","الوضع الغامق"],
    foot:"موقع مستقل ومش تبع أي شركة ذكاء اصطناعي مذكورة فيه.",
    steps:[["افهم الذكاء الاصطناعي","الدرس المجاني: البرومبت اللي ليه 4 أجزاء","/ar/#free-lesson"],["اتعلّم تكتب البرومبت","5 طرق للبرومبت بتشتغل في أي أداة","/ar/lessons/prompt-patterns/"],["اتقن ChatGPT","جهّز ChatGPT للشغل","/ar/lessons/set-up-chatgpt-for-work/"],["اكتشف Claude","مشاريع Claude: بطّل تعيد وتزيد","/ar/lessons/claude-projects/"],["اعمل طريقة شغل بالذكاء الاصطناعي","لخّص الملفات الطويلة والاجتماعات","/ar/lessons/summarize-documents-and-meetings/"],["خلّي شغلك أوتوماتيك","أول أتمتة ليك من غير برمجة","/ar/lessons/first-ai-automation/"]],
    c:{title:"شهادة إتمام",certifies:"الشهادة دي بتأكد إن",completed:"خلّص «ابدأ هنا: الذكاء الاصطناعي في الشغل»",
      body:"6 دروس عملية: البرومبت اللي ليه 4 أجزاء، وطرق البرومبت، وChatGPT للشغل، ومشاريع Claude، وتلخيص الملفات والاجتماعات، وأول أتمتة من غير برمجة.",
      issued:"تاريخ الإصدار",by:"أحمد حسين",byRole:"دروس الذكاء الاصطناعي",id:"رقم الشهادة",placeholder:"اسمك"}}
};
// Step 1 has no lesson page, so the site never tracks it; we keep our own tick for it.
const SLUGS = [null, 'prompt-patterns', 'set-up-chatgpt-for-work', 'claude-projects', 'summarize-documents-and-meetings', 'first-ai-automation'];
const SITE = 'https://ahmed-ai-lessons-website.vercel.app';

const params = new URLSearchParams(location.search);
const state = { lang: params.get('lang') === 'ar' || location.pathname.startsWith('/ar/') ? 'ar' : 'en', theme: document.documentElement.dataset.theme || 'dark' };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }
};

function progress() {
  const done = store.get('ahl:done', []);
  const cert = store.get('ahl:cert', {});
  return SLUGS.map((s, i) => i === 0 ? !!cert.step1 : Array.isArray(done) && done.includes(s));
}
function certInfo() {
  const cert = store.get('ahl:cert', {});
  if (!cert.id) { cert.id = 'AHL-' + Math.random().toString(36).slice(2, 8).toUpperCase(); store.set('ahl:cert', cert); }
  if (!cert.date && progress().every(Boolean)) { const n = new Date(); cert.date = n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0'); store.set('ahl:cert', cert); }
  return cert;
}

function renderSteps() {
  const t = T[state.lang], p = progress(), d = p.filter(Boolean).length;
  $('#count').textContent = t.count(d, p.length);
  $('#meter').style.width = (d / p.length * 100) + '%';
  $('#steps').innerHTML = t.steps.map(([title, sub, href], i) => `
    <li class="step${p[i] ? ' is-done' : ''}"><span class="step__n" aria-hidden="true">${p[i] ? '✓' : i + 1}</span>
      <span class="step__t">${esc(title)}</span><span class="step__s">${esc(sub)}</span>
      <span class="step__go">${p[i] ? `<span class="done-tag">${t.done}</span>` :
        (i === 0 ? `<a class="btn btn--quiet btn--sm" href="${href}">${t.open}</a> <button class="btn btn--quiet btn--sm" type="button" id="mark1">${t.markDone}</button>`
                 : `<a class="btn btn--quiet btn--sm" href="${href}">${t.open}</a>`)}</span></li>`).join('');
}

/* ---------- Certificate drawing ---------- */
const fontsReady = (async () => {
  const faces = [
    new FontFace('Cert Serif', 'url(/assets/instrument-serif-latin-400-normal-DnYpCC2O.woff2)'),
    new FontFace('Cert Arabic', 'url(/assets/amiri-arabic-700-normal-D7VDNf4C.woff2)', { weight: '700' }),
    new FontFace('Cert Arabic Reg', 'url(/assets/amiri-arabic-400-normal-DdpaZWqT.woff2)')
  ];
  await Promise.all(faces.map(f => f.load().then(ff => document.fonts.add(ff)).catch(() => {})));
  await document.fonts.ready;
})();

function wrap(ctx, text, maxW) {
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) { const test = line ? line + ' ' + w : w; if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test; }
  if (line) lines.push(line);
  return lines;
}

async function draw() {
  await fontsReady;
  const t = T[state.lang].c, ar = state.lang === 'ar', cv = $('#cert'), ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height, cert = certInfo(), unlocked = progress().every(Boolean);
  const name = ($('#name').value.trim() || t.placeholder).slice(0, 60);
  const serif = ar ? '"Cert Arabic", "Cert Serif", serif' : '"Cert Serif", Georgia, serif';
  const sans = ar ? '"IBM Plex Sans Arabic", sans-serif' : '"Inter Tight Variable", system-ui, sans-serif';
  const ink = '#13221c', muted = '#56695f', red = '#c2412f', hi = '#f2cc3a';
  ctx.direction = ar ? 'rtl' : 'ltr';
  // Ledger paper: ruled lines and a double red margin.
  ctx.fillStyle = '#eef3ea'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#d9e4d5'; for (let y = 150; y < H - 40; y += 46) ctx.fillRect(0, y, W, 2);
  const mx = ar ? W - 132 : 120;
  ctx.fillStyle = red; ctx.fillRect(mx, 0, 3, H); ctx.fillRect(mx + (ar ? -10 : 10), 0, 3, H);
  ctx.strokeStyle = ink; ctx.lineWidth = 3; ctx.strokeRect(36, 36, W - 72, H - 72);
  const x = ar ? W - 200 : 200, maxW = W - 400;
  ctx.textAlign = ar ? 'right' : 'left'; ctx.textBaseline = 'alphabetic';
  // Title
  ctx.fillStyle = ink; ctx.font = `${ar ? 700 : 400} ${ar ? 76 : 92}px ${serif}`;
  ctx.fillText(t.title, x, 250);
  ctx.fillStyle = muted; ctx.font = `500 32px ${sans}`;
  ctx.fillText(t.certifies, x, 360);
  // Name on a highlighter stroke: the one bold mark on the page.
  let size = ar ? 104 : 120; ctx.font = `${ar ? 700 : 400} ${size}px ${serif}`;
  while (ctx.measureText(name).width > maxW && size > 48) { size -= 4; ctx.font = `${ar ? 700 : 400} ${size}px ${serif}`; }
  const nw = ctx.measureText(name).width, ny = 500;
  ctx.fillStyle = hi; ctx.globalAlpha = .85;
  ctx.beginPath(); const hx = ar ? x - nw - 18 : x - 18;
  ctx.moveTo(hx, ny - size * .38); ctx.lineTo(hx + nw + 36, ny - size * .44); ctx.lineTo(hx + nw + 40, ny + size * .14); ctx.lineTo(hx - 4, ny + size * .18); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1; ctx.fillStyle = ink; ctx.fillText(name, x, ny);
  // What they completed
  ctx.font = `600 40px ${sans}`; ctx.fillText(t.completed, x, 620);
  ctx.fillStyle = muted; ctx.font = `400 30px ${sans}`;
  wrap(ctx, t.body, maxW).forEach((l, i) => ctx.fillText(l, x, 690 + i * 46));
  // Footer: date, issuer, ID, link.
  const date = cert.date ? new Date(cert.date + 'T12:00:00').toLocaleDateString(ar ? 'ar-SA-u-nu-latn' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : '-';
  const fy = 930, x2 = ar ? x - 640 : x + 640;
  ctx.fillStyle = ink; ctx.fillRect(ar ? x - 520 : x, fy - 52, 520, 2); ctx.fillRect(ar ? x2 - 560 : x2, fy - 52, 560, 2);
  ctx.font = `600 30px ${sans}`; ctx.fillText(t.by + ' · ' + t.byRole, x, fy); ctx.fillText(t.issued + ': ' + date, x2, fy);
  ctx.fillStyle = muted; ctx.font = `400 24px ${sans}`;
  ctx.fillText(t.id + ': ' + cert.id, x, fy + 46);
  ctx.direction = 'ltr'; ctx.textAlign = ar ? 'right' : 'left';
  ctx.fillText('ahmed-ai-lessons-website.vercel.app/certificate', x2, fy + 46);
  cv.setAttribute('aria-label', `${t.title}: ${name}`);

  const left = progress().filter(v => !v).length, tr = T[state.lang];
  $('#locked').hidden = unlocked;
  $('#locked').textContent = tr.lockedMsg(left);
  const ready = unlocked && $('#name').value.trim().length > 1;
  $('#download').disabled = !ready;
  $('#share').disabled = !unlocked;
  const li = $('#linkedin');
  if (unlocked) {
    const d = cert.date ? new Date(cert.date) : new Date();
    li.href = 'https://www.linkedin.com/profile/add?startTask=CERTIFICATION_NAME&name=' + encodeURIComponent('Start Here: AI for Work') +
      '&organizationName=' + encodeURIComponent('Ahmed Hussein AI Lessons') + '&issueYear=' + d.getFullYear() + '&issueMonth=' + (d.getMonth() + 1) +
      '&certUrl=' + encodeURIComponent(SITE + '/certificate') + '&certId=' + encodeURIComponent(cert.id);
    li.removeAttribute('aria-disabled'); li.style.pointerEvents = '';
  } else { li.removeAttribute('href'); li.setAttribute('aria-disabled', 'true'); li.style.pointerEvents = 'none'; li.style.opacity = '.45'; }
  if (unlocked) li.style.opacity = '';
}

function renderStatic() {
  const t = T[state.lang];
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t[el.dataset.t]; });
  $('#name').placeholder = t.namePh;
  $('#lang').textContent = t.other; $('#lang').lang = state.lang === 'ar' ? 'en' : 'ar';
  const dark = state.theme === 'dark';
  $('#theme').textContent = dark ? '☀' : '☾'; $('#theme').setAttribute('aria-label', t.theme[dark ? 0 : 1]);
  document.title = state.lang === 'ar' ? 'شهادة «ابدأ هنا» | أحمد حسين · دروس الذكاء الاصطناعي' : 'Your Start Here certificate | Ahmed Hussein · AI Lessons';
}
function render() { renderStatic(); renderSteps(); draw(); }

let toastTimer;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200); }

$('#steps').addEventListener('click', e => {
  if (e.target.id !== 'mark1') return;
  const cert = store.get('ahl:cert', {}); cert.step1 = true; store.set('ahl:cert', cert);
  renderSteps(); draw();
});
let nt; $('#name').addEventListener('input', () => {
  const cert = store.get('ahl:cert', {}); cert.name = $('#name').value; store.set('ahl:cert', cert);
  clearTimeout(nt); nt = setTimeout(draw, 120);
});
$('#download').addEventListener('click', () => {
  if ($('#download').disabled) return;
  const a = document.createElement('a');
  a.download = 'start-here-certificate-' + certInfo().id + '.png';
  a.href = $('#cert').toDataURL('image/png'); a.click();
});
$('#share').addEventListener('click', async () => {
  const t = T[state.lang], url = SITE + (state.lang === 'ar' ? '/ar/certificate' : '/certificate');
  if (navigator.share) { try { await navigator.share({ title: document.title, text: t.shareText, url }); } catch (_) {} }
  else { try { await navigator.clipboard.writeText(t.shareText + ' ' + url); toast(t.linkCopied); } catch (_) {} }
});
$('#lang').addEventListener('click', () => {
  state.lang = state.lang === 'en' ? 'ar' : 'en';
  history.replaceState(null, '', state.lang === 'ar' ? '/ar/certificate' : '/certificate'); render();
});
$('#theme').addEventListener('click', () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = state.theme;
  try { localStorage.setItem('ahl:theme', state.theme); } catch (_) {}
  renderStatic();
});
// Progress can change in another tab (finishing a lesson); refresh when the visitor comes back.
window.addEventListener('focus', () => { renderSteps(); draw(); });

$('#name').value = store.get('ahl:cert', {}).name || '';
render();
</script>
<script defer src="/ahl-links.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
