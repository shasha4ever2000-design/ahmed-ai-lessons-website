    noteExample:"رائع: أضفت مثالًا. هذه من أفضل الطرق للحصول على الأسلوب الذي تريده.",
    noteAsk:"رائع: طلبت منه أن يسألك أسئلة أولًا.",
    noteBrackets:"ما زالت هناك أقواس [ ]. املأها قبل الإرسال.",
    notePrivate:k=>`يبدو أن طلبك يحتوي على ${k}. استبدله برمز بديل مثل [العميل] قبل لصقه في أي أداة ذكاء اصطناعي.`,
    privKinds:{email:"عنوان بريد إلكتروني",phone:"رقم هاتف",iban:"رقم حساب بنكي (IBAN)",card:"رقم بطاقة أو حساب"},
    safeLink:"اقرأ: ما الذي لا تلصقه أبدًا",
    upT:"الطلب المحسّن", upS:"احتفظنا بكلماتك وأضفنا الأجزاء الناقصة. املأ الأقواس [ ] ثم الصقه في أداة الذكاء الاصطناعي.",
    upFull:"طلبك يحتوي على الأجزاء الأربعة. انسخه كما هو.",
    copy:"انسخ الطلب", copied:"تم النسخ", share:"شارك درجتي",
    shareText:n=>`حصلت على ${n}/100 في أداة تقييم الطلبات المجانية. هل تستطيع أن تتفوق عليّ؟`, linkCopied:"تم نسخ الرابط",
    copiedToast:"تم النسخ. املأ الأقواس [ ] قبل الإرسال.",
    how1t:"١. الدور", how1:"من يجب أن يكون الذكاء الاصطناعي. يحدد الخبرة والأسلوب.",
    how2t:"٢. المهمة والسياق", how2:"ما تريده، مع الحقائق التي لا يستطيع تخمينها: لمن، وماذا حدث.",
    how3t:"٣. الشكل", how3:"كيف تبدو الإجابة: الطول، نقاط أو جدول، والأسلوب.",
    ctaTitle:"تعلّم الطلب ذا الأجزاء الأربعة في 5 دقائق", ctaText:"الدرس المجاني الذي بُنيت عليه هذه الأداة، مع أمثلة تنسخها.",
    ctaBtn:"افتح الدرس المجاني", ctaLib:"تصفّح 30 طلبًا جاهزًا",
    other:"English", theme:["الوضع الفاتح","الوضع الداكن"],
    foot:"موقع مستقل غير تابع لأي شركة ذكاء اصطناعي مذكورة فيه. تفحص الأداة بنية طلبك بقواعد بسيطة، ولا ترسل نصك إلى أي مكان.",
    up:{role:"أنت [الخبير الذي تحتاجه، مثل: محاسب خبير].",task:"المهمة: [قل ما تريده بالضبط، مثل: اكتب / لخّص / قارن].",context:"السياق: [لمن الرد، وماذا حدث، والحقائق المهمة].",format:"الشكل: [الطول، مثل: أقل من 120 كلمة]، [نقاط أو جدول]، [الأسلوب: رسمي أو ودود]."}}
};

const EXAMPLES = {
  en: { weak:"write an email about the meeting",
    strong:"You are my office assistant.\nWrite a short email to my team saying Thursday's meeting moves to 2 pm.\nThere are 6 of us and some work remotely, so include the Teams link.\nKeep it under 80 words, friendly but professional, and end with a question." },
  ar: { weak:"اكتب إيميل عن الاجتماع",
    strong:"أنت مساعدي في المكتب.\nاكتب إيميلًا قصيرًا لفريقي بأن اجتماع الخميس انتقل إلى الساعة 2 ظهرًا.\nنحن 6 أشخاص وبعضنا يعمل عن بُعد، لذلك أضف رابط Teams.\nاجعله أقل من 80 كلمة، بأسلوب ودود ومهني، واختمه بسؤال." }
};

/* ---------- Grading rules ----------
   Each part has English and Arabic patterns. English uses word boundaries;
   Arabic matches word starts (allowing و/ف prefixes) because suffixes vary. */
const en = f => new RegExp(`(^|[^a-z0-9])(${f})(?![a-z])`, 'gi');
// whole=true for short words that would otherwise match inside longer ones (أنت in انتقل).
const ar = (f, whole) => new RegExp(`(^|[^\\u0600-\\u06FF])((?:و|ف)?(?:${f}))${whole ? '(?![\\u0600-\\u06FF])' : ''}`, 'g');
const RULES = {
  role: [
    en("you are(?: an?| my| the)?|you're(?: an?| my)?|act(?:ing)? as(?: an?| my)?|pretend(?: to be| you are)|imagine you are|take the role of|your role is|role:|as an? (?:expert|experienced|senior|professional|specialist)"),
    ar("أنت|انت|أنتَ", true), ar("تصرّف ك|تصرف ك|بصفتك|كأنك|دورك|اعمل ك|الدور:")],
  taskStrong: [
    en("write|draft|summari[sz]e|create|make|explain|list|translate|rewrite|re-write|review|check|compare|analy[sz]e|build|give me|suggest|plan|prepare|calculate|convert|extract|generate|fix|improve|find|design|edit|proofread|outline|turn|reply|respond|classify|sort|rank|recommend|brainstorm|reconcile|format|shorten|simplify|identify|answer"),
    ar("اكتب|أكتب|لخّص|لخص|أنشئ|انشئ|اشرح|ترجم|راجع|قارن|حلّل|حلل|اقترح|جهّز|جهز|احسب|صحّح|صحح|حسّن|حسن|أعد صياغة|اعد صياغة|أعطني|اعطني|رتّب|رتب|استخرج|صمّم|صمم|اذكر|حوّل|حول|ردّ|رد على|صنّف|صنف|أجب|اجب"), ar("ضع", true)],
  taskVague: [
    en("help me(?: with)?|tell me about|something about|i need|can you|i want"),
    ar("ساعدني|أخبرني عن|اخبرني عن|أريد|اريد|أحتاج|احتاج|هل يمكنك")],
  context: [
    en("because|so that|for my|for our|for the|my (?:team|manager|boss|client|customer|company|colleagues?|audience|students?)|our (?:team|company|clients?|customers?)|the (?:reader|audience|client|customer)|audience|background|context:|we are|we have|i am an?|i'm an?|i work|there are|currently|deadline|last (?:month|week|year|quarter)|this (?:month|week|year|quarter)|due to|after|before|who (?:is|are)|\\d+ (?:people|of us|employees|staff|clients|customers|items|rows|columns|invoices|accounts)"),
    ar("لأن|لان|حتى|لفريقي|فريقي|مديري|عميل|العميل|عملاء|شركتنا|شركتي|الجمهور|القارئ|السياق|الخلفية|نحن|لدينا|عندنا|أنا|انا أعمل|أعمل|يوجد|هناك|حالي|الموعد|الشهر الماضي|هذا الشهر|بسبب|بعد|قبل|موجّه|موجه")],
  format: [
    en("\\d+ (?:words?|sentences?|bullets?|bullet points|points|lines?|paragraphs?|characters|items|slides|steps)|under \\d+|at most|no more than|max(?:imum)?|bullet(?:s| points?)?|a list|numbered|table|json|csv|markdown|headings?|subject line|step[- ]by[- ]step|in (?:english|arabic)|formal|friendly|polite|professional|casual|simple|plain (?:words|english|language)|tone|short|brief|concise|one page|end with|start with|format:"),
    ar("\\d+ (?:كلمة|كلمات|جملة|جمل|نقطة|نقاط|سطر|أسطر|فقرة|فقرات|خطوات)|لا يزيد|لا تزيد|أقل من|اقل من|على الأكثر|نقاط|جدول|قائمة|مرقّمة|مرقمة|بأسلوب|اسلوب|أسلوب|رسمي|ودود|مهني|مختصر|باختصار|قصير|خطوة بخطوة|عنوان|بالعربية|بالإنجليزية|اختم|ابدأ ب|الشكل:")],
  example: [en("for example|e\\.g\\.|such as|like this|example:|here is an example|sample:"), ar("مثال|مثلاً|مثلا|على سبيل المثال")],
  askFirst: [en("ask me|questions? (?:first|before)|before you (?:start|answer|begin)"), ar("اسألني|اسالني|أسئلة قبل|اسئلة قبل|قبل أن تبدأ|قبل ان تبدأ")]
};
const PRIVATE = {
  email: /[\w.+-]+@[\w-]+\.[\w.]+/,
  iban: /\b[A-Z]{2}\d{2}(?:\s?[A-Z0-9]{4}){3,7}\b/,
  card: /\b(?:\d[ -]?){13,19}\b/,
  phone: /(?:\+|00)\d[\d\s-]{7,}\d|\b05\d[\s-]?\d{3}[\s-]?\d{4}\b/
};

function hits(text, regs) {
  const out = [];
  for (const re of regs) {
    re.lastIndex = 0; let m;
    while ((m = re.exec(text))) {
      const start = m.index + m[1].length, word = m[2];
      if (word.trim()) out.push({ start, end: start + word.length, word: word.toLowerCase().trim() });
      if (re.lastIndex === m.index) re.lastIndex++;
    }
  }
  return out;
}
const distinct = h => new Set(h.map(x => x.word)).size;
const countWords = s => (s.trim().match(/[\p{L}\p{N}]+/gu) || []).length;

function grade(text) {
  const words = countWords(text);
  const h = {
    role: hits(text, RULES.role), task: hits(text, RULES.taskStrong), vague: hits(text, RULES.taskVague),
    context: hits(text, RULES.context), format: hits(text, RULES.format)
  };
  // Long pasted material (several lines or a quoted block) is context too.
  const pasted = text.split(/\n/).filter(l => l.trim()).length >= 4 || /["“«][^"”»]{80,}["”»]/.test(text);
  const ctxCount = distinct(h.context) + (pasted ? 1 : 0);
  const st = {
    role: h.role.length ? 'full' : 'missing',
    task: h.task.length && words >= 4 ? 'full' : (h.task.length || h.vague.length) ? 'partial' : 'missing',
    context: ctxCount >= 2 || (ctxCount === 1 && words >= 40) ? 'full' : ctxCount === 1 ? 'partial' : 'missing',
    format: distinct(h.format) >= 2 ? 'full' : h.format.length ? 'partial' : 'missing'
  };
  const pts = s => s === 'full' ? 25 : s === 'partial' ? 12 : 0;
  let score = ['role','task','context','format'].reduce((a, k) => a + pts(st[k]), 0);
  if (words < 6) score = Math.min(score, 30);
  const privateKinds = Object.keys(PRIVATE).filter(k => PRIVATE[k].test(text));
  return {
    words, score, st, pts,
    marks: { role: h.role, task: h.task.concat(h.vague), context: h.context, format: h.format },
    example: hits(text, RULES.example).length > 0,
    askFirst: hits(text, RULES.askFirst).length > 0,
    brackets: /\[[^\]]+\]/.test(text),
    privateKinds
  };
}

/* ---------- UI ---------- */
const params = new URLSearchParams(location.search);
const state = {
  lang: params.get('lang') === 'ar' || location.pathname.startsWith('/ar/') ? 'ar' : 'en',
  theme: document.documentElement.dataset.theme || 'dark'
};
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isArabic = s => (s.match(/[؀-ۿ]/g) || []).length > (s.match(/[a-z]/gi) || []).length;
const COLORS = ['var(--bad)', 'var(--warn)', 'var(--accent)', 'var(--ok)'];
let last = null;

function markUp(text, marks) {
  // Merge part matches into non-overlapping ranges, earliest first.
  const ranges = [];
  for (const part of Object.keys(marks)) for (const r of marks[part]) ranges.push({ ...r, part });
  ranges.sort((a, b) => a.start - b.start || b.end - a.end);
  let out = '', pos = 0;
  for (const r of ranges) {
    if (r.start < pos) continue;
    out += esc(text.slice(pos, r.start)) + `<mark class="m-${r.part}">${esc(text.slice(r.start, r.end))}</mark>`;
    pos = r.end;
  }
  return out + esc(text.slice(pos));
}

function upgraded(text, g) {
  // Template language follows the prompt, not the page, so the upgrade reads naturally.
  const up = T[isArabic(text) ? 'ar' : 'en'].up;
  const lines = [];
  if (g.st.role === 'missing') lines.push(up.role);
  lines.push(text.trim());
  if (g.st.task !== 'full') lines.push(up.task);
  if (g.st.context !== 'full') lines.push(up.context);
  if (g.st.format !== 'full') lines.push(up.format);
  return lines.join('\n');
}

function render() {
  const t = T[state.lang];
  const text = $('#prompt').value;
  $('#words').textContent = t.words(countWords(text));
  if (!text.trim()) {
    last = null;
    $('#results').innerHTML = `<div class="empty"><b>${t.emptyT}</b>${t.emptyS}</div>`;
    return;
  }
  const g = grade(text);
  const band = g.score >= 90 ? 3 : g.score >= 70 ? 2 : g.score >= 40 ? 1 : 0;
  const color = COLORS[band];
  const C = 2 * Math.PI * 50;
  const notes = [];
  for (const k of g.privateKinds) notes.push(`<li class="note note--warn"><i aria-hidden="true">⚠</i><span>${esc(t.notePrivate(t.privKinds[k]))} <a href="${state.lang === 'ar' ? '/ar' : ''}/lessons/use-ai-safely/">${t.safeLink}</a></span></li>`);
  if (g.words < 12) notes.push(`<li class="note"><i aria-hidden="true">✎</i><span>${t.noteShort}</span></li>`);
  if (g.brackets) notes.push(`<li class="note"><i aria-hidden="true">[ ]</i><span>${t.noteBrackets}</span></li>`);
  if (g.example) notes.push(`<li class="note"><i aria-hidden="true">✓</i><span>${t.noteExample}</span></li>`);
  if (g.askFirst) notes.push(`<li class="note"><i aria-hidden="true">✓</i><span>${t.noteAsk}</span></li>`);
  const allFull = Object.values(g.st).every(s => s === 'full');
  last = { g, up: allFull ? text.trim() : upgraded(text, g) };
  const upHtml = esc(last.up).replace(/\[([^\]]+)\]/g, '<mark>[$1]</mark>');

  $('#results').innerHTML = `
    <div class="score" style="--c:${color}">
      <div class="ring" role="img" aria-label="${g.score} ${t.out}">
        <svg width="112" height="112" viewBox="0 0 112 112" aria-hidden="true"><circle class="track" cx="56" cy="56" r="50"/>
          <circle class="bar-c" cx="56" cy="56" r="50" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - g.score / 100)}"/></svg>
        <b><span>${g.score}<small>${t.out}</small></span></b>
      </div>
      <div><p class="verdict">${t.verdicts[band][0]}</p><p class="verdict-sub">${t.verdicts[band][1]}</p></div>
    </div>
    <ul class="parts">${['role','task','context','format'].map(k => `
      <li class="part m-${k}"><span class="part__dot" aria-hidden="true"></span>
        <span class="part__name">${t.parts[k]}<span class="pill pill--${g.st[k]}">${t.status[g.st[k]]}</span></span>
        <span class="part__pts">${t.pts(g.pts(g.st[k]))}</span>
        <span class="part__tip">${t.tips[k][g.st[k]]}</span></li>`).join('')}
    </ul>
    <p class="sub">${t.seeT}</p>
    <div class="marked" dir="auto">${markUp(text, g.marks)}</div>
    <div class="legend">${['role','task','context','format'].map(k => `<span class="m-${k}">${t.parts[k]}</span>`).join('')}</div>
    ${notes.length ? `<p class="sub">${t.notesT}</p><ul class="notes">${notes.join('')}</ul>` : ''}
    <p class="sub">${t.upT}</p>
    <p style="color:var(--text-2);font-size:14px;margin-bottom:10px">${allFull ? t.upFull : t.upS}</p>
    <div class="upgrade" dir="auto">${upHtml}</div>
    <div class="row">
      <button class="btn btn--primary" type="button" id="copyUp">${t.copy}</button>
      <button class="btn btn--quiet" type="button" id="shareScore">${t.share}</button>
    </div>`;
}

function renderStatic() {
  const t = T[state.lang];
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t[el.dataset.t]; });
  $('#prompt').placeholder = t.placeholder;
  $('#lang').textContent = t.other;
  $('#lang').lang = state.lang === 'ar' ? 'en' : 'ar';
  $('#ctaLesson').href = state.lang === 'ar' ? '/ar/#free-lesson' : '/#free-lesson';
  $('#ctaLib').href = state.lang === 'ar' ? '/ar/prompt-library' : '/prompt-library';
  const dark = state.theme === 'dark';
  $('#theme').textContent = dark ? '☀' : '☾';
  $('#theme').setAttribute('aria-label', t.theme[dark ? 0 : 1]);
  document.title = state.lang === 'ar' ? 'مقيّم الطلبات | أحمد حسين · دروس الذكاء الاصطناعي' : 'Prompt Grader | Ahmed Hussein · AI Lessons';
}

async function copyText(s) {
  try { await navigator.clipboard.writeText(s); return true; }
  catch (_) {
    const ta = document.createElement('textarea'); ta.value = s; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  }
}
let toastTimer;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}
function save() { try { localStorage.setItem('ahl:grader', $('#prompt').value); } catch (_) {} }

let timer;
$('#prompt').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { render(); save(); }, 150); });
$('#clear').addEventListener('click', () => { $('#prompt').value = ''; render(); save(); $('#prompt').focus(); });
document.querySelectorAll('[data-example]').forEach(b => b.addEventListener('click', () => {
  $('#prompt').value = EXAMPLES[state.lang][b.dataset.example]; render(); save();
}));
$('#results').addEventListener('click', async e => {
  if (!last) return;
  const t = T[state.lang];
  if (e.target.id === 'copyUp' && await copyText(last.up)) {
    e.target.textContent = t.copied; e.target.classList.add('is-done'); toast(t.copiedToast);
    setTimeout(() => { e.target.textContent = t.copy; e.target.classList.remove('is-done'); }, 1600);
  }
  if (e.target.id === 'shareScore') {
    // Shares the score and the page link only, never the prompt text.
    const url = location.origin + (state.lang === 'ar' ? '/ar/prompt-grader' : '/prompt-grader');
    const text = t.shareText(last.g.score);
    if (navigator.share) { try { await navigator.share({ title: document.title, text, url }); } catch (_) {} }
    else if (await copyText(text + ' ' + url)) toast(t.linkCopied);
  }
});
$('#lang').addEventListener('click', () => {
  state.lang = state.lang === 'en' ? 'ar' : 'en';
  history.replaceState(null, '', state.lang === 'ar' ? '/ar/prompt-grader' : '/prompt-grader');
  renderStatic(); render();
});
$('#theme').addEventListener('click', () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = state.theme;
  try { localStorage.setItem('ahl:theme', state.theme); } catch (_) {}
  renderStatic();
});

try { const saved = localStorage.getItem('ahl:grader'); if (saved) $('#prompt').value = saved; } catch (_) {}
renderStatic(); render();
</script>
<script defer src="/ahl-links.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
